version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

vendors:
  kronk-sdk:
    in: "github.com/ardanlabs/kronk/sdk/**"

components:
  L00_core: { in: layers/00_core }
  L01_inference: { in: layers/01_inference }
  L02_orchestrate: { in: layers/02_orchestrate }
  L03_context: { in: layers/03_context }
  L04_tool: { in: layers/04_tool }
  L05_constraint: { in: layers/05_constraint }
  L06_rerank: { in: layers/06_rerank }
  L07_validate: { in: layers/07_validate }
  L08_prompt: { in: layers/08_prompt }
  L09_memory: { in: layers/09_memory }
  L10_observe: { in: layers/10_observe }
  L11_api: { in: layers/11_api }
  kronk: { in: kronk }
  tui: { in: tui }

deps:
  # L00_core: {}
  L01_inference:
    mayDependOn: [L00_core]
    canUse: [kronk-sdk]
  L02_orchestrate:
    mayDependOn: [L00_core, L01_inference, L04_tool, L05_constraint, L09_memory, L10_observe]
  L03_context:
    mayDependOn: [L00_core]
  L04_tool:
    mayDependOn: [L00_core, L10_observe]
  L05_constraint:
    mayDependOn: [L00_core]
  # L06_rerank: {}
  L07_validate:
    mayDependOn: [L00_core, L05_constraint]
  L08_prompt:
    mayDependOn: [L00_core]
  L09_memory:
    mayDependOn: [L00_core]
  L10_observe:
    mayDependOn: [L00_core]
  L11_api:
    mayDependOn: [L00_core, L02_orchestrate, L10_observe]
  kronk:
    canUse: [kronk-sdk]
  tui:
    mayDependOn: [L00_core, L01_inference, L02_orchestrate, L04_tool, L10_observe]
