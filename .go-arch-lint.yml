version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

vendors:
  kronk-sdk:
    in: "github.com/ardanlabs/kronk/sdk/**"

components:
  core: { in: layers/00_core }
  inference: { in: layers/01_inference }
  orchestrate: { in: layers/02_orchestrate }
  context: { in: context }
  tool: { in: tool }
  constraint: { in: constraint }
  rerank: { in: rerank }
  validate: { in: validate }
  prompt: { in: prompt }
  memory: { in: memory }
  observe: { in: observe }
  api: { in: api }
  kronk: { in: kronk }
  tui: { in: tui }

deps:
  # core: {}
  prompt:
    mayDependOn: [core]
  memory:
    mayDependOn: [core]
  observe:
    mayDependOn: [core]
  constraint:
    mayDependOn: [core]
  validate:
    mayDependOn: [core, constraint]
  inference:
    mayDependOn: [core, observe]
    canUse: [kronk-sdk]
  tool:
    mayDependOn: [core, observe]
  context:
    mayDependOn: [core, observe]
  rerank:
    mayDependOn: [core, observe]
  orchestrate:
    mayDependOn: [core, inference, tool, prompt, memory, constraint, validate, context, rerank, observe]
  api:
    mayDependOn: [core, orchestrate, observe]
  kronk:
    canUse: [kronk-sdk]
  tui:
    mayDependOn: [api, core, inference, orchestrate, tool, observe]
