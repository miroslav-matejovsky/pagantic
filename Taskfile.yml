# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  clean:
    desc: Remove build artifacts, .test-results, and .exe files
    silent: true
    cmds:
      - pwsh -NoProfile -NonInteractive -File tasks/clean.ps1{{if .QUIET}} > NUL 2>&1{{end}}
      - echo clean done

  tidy:
    desc: Run go mod tidy to clean up dependencies
    silent: true
    cmds:
      - go mod tidy
      - echo tidy done

  vet:
    desc: Run go vet to check for potential issues
    silent: true
    cmds:
      - go vet ./...
      - echo vet done

  fmt:
    desc: Run go fmt to format the code
    silent: true
    cmds:
      - go fmt ./...
      - echo fmt done

  lint:
    desc: Run golangci-lint
    silent: true
    cmds:
      - echo "Running golangci-lint. This may take a moment..."
      - golangci-lint run ./...
      - echo lint done

  lint-fix:
    desc: Run golangci-lint with auto-fix
    silent: true
    cmds:
      - golangci-lint run --fix ./...
      - echo lint-fix done

  arch-lint:
    desc: Run go-arch-lint to check package dependencies and architectural rules
    silent: true
    cmds:
      - go-arch-lint check
      - echo arch-lint done

  deadcode:
    desc: Check for unreachable functions in cmd entry points
    silent: true
    cmds:
      - pwsh -NoProfile -NonInteractive -File tasks/deadcode.ps1

  test:
    desc: Run unit tests (saved to .test-results/)
    silent: true
    cmds:
      - pwsh -NoProfile -NonInteractive -File tasks/test.ps1

  test-integration:
    desc: Run integration tests (requires LLM model download, saved to .test-results/)
    silent: true
    cmds:
      - pwsh -NoProfile -NonInteractive -File tasks/test-integration.ps1

  all-no-test:
    desc: Run all checks except tests. Use 'task fast' to include unit tests without integration tests, or 'task all' to include all tests.
    silent: true
    cmds:
      - task: clean
        # Set QUIET=1 to suppress output from clean since it can be very verbose and is not the main focus of this task.
        vars:
          QUIET: "1"
      - task: tidy
      - task: vet
      - task: fmt
      - task: lint
      - task: arch-lint
      - task: deadcode
      - echo all-no-test done

  fast:
    desc: Run all checks and tests except integration tests, which can be slow due to LLM model downloads. Use 'task all' to include integration tests.
    silent: true
    cmds:
      - task: all-no-test
      - task: test
      - echo all done

  all:
    desc: Run all checks and tests, including integration tests. Note that integration tests can be slow due to LLM model downloads, so use 'task fast' for a quicker check that excludes integration tests.
    silent: true
    cmds:
      - task: all-no-test
      - task: test-integration
      - echo all done

  # --- running stuff ---

  run-simple-chat:
    desc: Run the simple-chat TUI example
    cmds:
      - go run examples/tui/simple-chat/main.go

  run-tool-use:
    desc: Run the tool-use TUI example
    cmds:
      - go run examples/tui/tool-use/main.go

  run-structured-output:
    desc: Run the structured-output TUI example
    cmds:
      - go run examples/tui/structured-output/main.go

  run-simple-query:
    desc: Run the simple-query CLI example (pass prompt as args)
    cmds:
      - go run examples/cli/simple-query/main.go {{.CLI_ARGS}}

  run-context-query:
    desc: Run the context-query CLI example with RAG (pass prompt as args)
    cmds:
      - go run examples/cli/context-query/main.go {{.CLI_ARGS}}

  run-grammar-query:
    desc: Run the grammar-query CLI example with GBNF constrained output (pass prompt as args)
    cmds:
      - go run examples/cli/grammar-query/main.go {{.CLI_ARGS}}

  run-rerank-query:
    desc: Run the rerank-query CLI example with document reranking (pass prompt as args)
    cmds:
      - go run examples/cli/rerank-query/main.go {{.CLI_ARGS}}

  run-redundant-query:
    desc: Run the redundant-query CLI example with majority voting (pass prompt as args)
    cmds:
      - go run examples/cli/redundant-query/main.go {{.CLI_ARGS}}

  run-context-chat:
    desc: Run the context-chat TUI example with per-turn context retrieval
    cmds:
      - go run examples/tui/context-chat/main.go

  # --- maintenance ---

  deps:
    desc: List direct dependencies with available updates
    silent: true
    cmds:
      - go mod tidy
      - go list -u -m -f "{{`{{if not .Indirect}}{{.}}{{end}}`}}" all

  go-tools:
    desc: Install or update required Go tools
    silent: true
    cmds:
      - echo "go-arch-lint for keeping package dependencies in check and enforcing architectural rules"
      - go install github.com/fe3dback/go-arch-lint@latest
      - echo "deadcode for clean code by detecting unused functions"
      - go install golang.org/x/tools/cmd/deadcode@latest
      - echo "gotestsum for improved test output formatting"
      - go install gotest.tools/gotestsum@latest
      - echo "goman for better man pages"
      - go install github.com/appliedgocode/goman@latest
      - echo done

  release:
    desc: Create a git tag for a new release (pass version as args, e.g. v1.2.3 or 1.2.3, and it will be prefixed with 'v' if not already)
    cmds:
      - pwsh -NoProfile -NonInteractive -File tasks/release.ps1 -Version {{.CLI_ARGS}}